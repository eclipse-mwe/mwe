name: Test Maven Wrapper

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper:
    name: Maven Wrapper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bootstrap Maven Wrapper on Unix
        if: runner.os != 'Windows'
        env:
          MAVEN_USER_HOME: ${{ github.workspace }}/.wrapper-test-m2
        run: ./mvnw --version

      - name: Bootstrap Maven Wrapper on Windows
        if: runner.os == 'Windows'
        env:
          MAVEN_USER_HOME: ${{ github.workspace }}/.wrapper-test-m2
        run: mvnw.cmd --version
        shell: cmd
